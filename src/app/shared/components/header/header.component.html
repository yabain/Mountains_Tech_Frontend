<header class="header" [class.home-page]="isHomePage$ | async" [class.scrolled]="isScrolled$ | async">
  <div class="container-fluid px-3 px-lg-4">
    <div class="header__inner d-flex align-items-center justify-content-between">
      <div class="brand">
        <a routerLink="/" class="brand-link" aria-label="Accueil">
          <img class="logo" src="/logoMountainsTech/logoNavBar.png" alt="Logo MountainsTech" />
        </a>
      </div>

      <button type="button" class="menu-toggle"
        [class.is-open]="isMenuOpen$ | async" [attr.aria-expanded]="isMenuOpen$ | async"
        aria-controls="main-navigation" aria-label="Ouvrir le menu principal"
        (click)="toggleMenu()">
        <i class="bi bi-list"></i>
      </button>

      <nav id="main-navigation" class="nav d-flex align-items-center justify-content-center" [class.is-open]="isMenuOpen$ | async" aria-label="Navigation principale">
        <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">Accueil</a>
        <a routerLink="/a-propos" routerLinkActive="active">À propos</a>
        <a routerLink="/membres" routerLinkActive="active">Membres</a>
        <a routerLink="/evenements" routerLinkActive="active">Événements</a>
        <a routerLink="/projets" routerLinkActive="active">Projets</a>
        <a routerLink="/hackathons" routerLinkActive="active">Hackathons</a>
        <a routerLink="/contact" routerLinkActive="active">Contact</a>
        <a routerLink="/login" routerLinkActive="active" class="login-link">Se Connecter</a>
      </nav>
    </div>
  </div>
</header>
