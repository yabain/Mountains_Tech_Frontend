<div
  class="alert-wrapper"
  [ngClass]="{
    'alert-wrapper--dismissible': dismissible(),
    'alert-wrapper--auto-hide': autoHide() !== null
  }"
  role="alert"
  aria-live="polite"
>
  <!-- Icon -->
  <span
    class="alert-icon"
    [ngClass]="{
      'alert-icon--info': variant() === 'info',
      'alert-icon--success': variant() === 'success',
      'alert-icon--warning': variant() === 'warning',
      'alert-icon--error': variant() === 'error'
    }"
    aria-hidden="true"
  >
    <ng-container>
      @if (variant() === 'info') {
        <i class="bi bi-info-circle"></i>
      } @else if (variant() === 'success') {
        <i class="bi bi-check-circle"></i>
      } @else if (variant() === 'warning') {
        <i class="bi bi-exclamation-triangle"></i>
      } @else {
        <i class="bi bi-x-circle"></i>
      }
    </ng-container>
  </span>

  <!-- Content -->
  <div class="alert-content">
    @if (title()) {
      <h3 class="alert-title">{{ title() }}</h3>
    }
    <p class="alert-message">{{ message() }}</p>
  </div>

  <!-- Actions/Close button -->
  <div class="alert-actions">
    @if (dismissible()) {
      <button
        type="button"
        class="alert-close-btn"
        aria-label="Fermer la notification"
        (click)="dismiss()"
      >
        <i class="bi bi-x" aria-hidden="true"></i>
      </button>
    }
  </div>
</div>
